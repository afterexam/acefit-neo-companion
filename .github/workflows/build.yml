name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run protocol tests
        run: bash ./test_protocol.sh

      - name: Build APK
        run: bash ./build.sh

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: acefit-neo-companion-apk
          path: build/acefit-neo-companion.apk
